after-startup-command = [
  # Initial layout only (not pinned). After this, move-workspace-to-monitor works.
  # Left-to-right: 1 = left Dell, 2 = laptop, 3 = right Dell.
  'move-workspace-to-monitor --workspace 1 built-in',
  'move-workspace-to-monitor --workspace 2 -- 1',
  'move-workspace-to-monitor --workspace 3 -- 1',
  'move-workspace-to-monitor --workspace 4 -- 3',
  'move-workspace-to-monitor --workspace 5 -- 3',
  'move-workspace-to-monitor --workspace 6 built-in',
  'move-workspace-to-monitor --workspace 7 built-in',
  'move-workspace-to-monitor --workspace 8 built-in',
  'move-workspace-to-monitor --workspace 9 built-in',
  'workspace 1',
  'exec-and-forget sketchybar',
  # JankyBorders: highlight the focused window. No args → ~/.config/borders/bordersrc
  'exec-and-forget borders',
]

# Notify Sketchybar about workspace / focus changes
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]
on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# [[on-window-detected]]
# if.app-id = 'com.apple.systempreferences'
# if.app-name-regex-substring = 'settings'
# if.window-title-regex-substring = 'substring'
# if.workspace = 'workspace-name'
# if.during-aerospace-startup = true
# check-further-callbacks = true
# run = ['layout floating', 'move-node-to-workspace S']  # The callback itself

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
# omerxx used 350px side insets for an ultrawide "main" monitor. This machine
# is a laptop + two 24" Dells, so those insets made the built-in display tiny.
inner.horizontal = 10
outer.left = [{ monitor."^Built-in.*$" = 8 }, 12]
outer.right = [{ monitor."^Built-in.*$" = 8 }, 12]
outer.bottom = [{ monitor."^Built-in.*$" = 8 }, 16]
# SketchyBar is 40px; keep outer.top above that so tiled windows do not cover it.
outer.top = [{ monitor."^Built-in.*$" = 50 }, 50]


# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

alt-ctrl-shift-f = 'fullscreen'
alt-ctrl-f = 'layout floating tiling'

# join-with used to be alt-shift-arrows, which stole macOS
# Shift+Option+Left/Right word selection in every app.
alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
# Send focused workspace to a specific screen (left Dell / laptop / right Dell).
alt-ctrl-1 = 'move-workspace-to-monitor -- 1'
alt-ctrl-2 = 'move-workspace-to-monitor built-in'
alt-ctrl-3 = 'move-workspace-to-monitor -- 3'

# SketchyBar window picker: list all windows, j/k highlight, enter focuses.
alt-space = [
  'mode window-picker',
  'exec-and-forget sketchybar --trigger window_picker_open',
]

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'
alt-shift-enter = 'mode apps'

# alt-t = 'exec-and-forget open -a /Applications/Telegram.app'
alt-o = 'exec-and-forget open -a /Applications/Obsidian.app'
alt-w = 'exec-and-forget open -a /Applications/WezTerm.app'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

[mode.apps.binding]
alt-w = ['exec-and-forget open -a /Applications/WezTerm.app', 'mode main']

[mode.window-picker.binding]
esc = ['exec-and-forget sketchybar --trigger window_picker_close', 'mode main']
alt-space = [
  'exec-and-forget sketchybar --trigger window_picker_close',
  'mode main',
]
j = 'exec-and-forget sketchybar --trigger window_picker_nav DIR=next'
k = 'exec-and-forget sketchybar --trigger window_picker_nav DIR=prev'
down = 'exec-and-forget sketchybar --trigger window_picker_nav DIR=next'
up = 'exec-and-forget sketchybar --trigger window_picker_nav DIR=prev'
enter = [
  'exec-and-forget sketchybar --trigger window_picker_select',
  'mode main',
]

# No workspace-to-monitor-force-assignment: that command is a no-op for pinned
# workspaces. Login placement lives in after-startup-command instead.
