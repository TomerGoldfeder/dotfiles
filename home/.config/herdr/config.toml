onboarding = false

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/tomergo/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+b"
detach = "prefix+q"

# Splits
split_horizontal = "prefix+h"
split_vertical = "prefix+v"

# Tabs
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+shift+p"
next_tab = "prefix+shift+n"

# Workspaces
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+w"
previous_workspace = "prefix+comma"
next_workspace = "prefix+period"
workspace_picker = "prefix+w"

# Agents (sidebar list)
previous_agent = "prefix+shift+comma"
next_agent = "prefix+shift+period"

# Sidebar
toggle_sidebar = "prefix+b"

# Pane focus — arrow keys after prefix
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
# Jump back to the previously focused pane. `l` is free: right-focus is the arrow.
last_pane = "prefix+l"

# Pane resize — shift+arrows after prefix
resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "pane-navigator.open"
description = "pane navigator"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "jt.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "radar: active <-> recent"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "radar settings"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+H"
type = "plugin_action"
command = "tomer.tab-panes.open"
description = "Show panes in this tab"


